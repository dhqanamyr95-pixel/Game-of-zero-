name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.3"
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack starter.zip (if present)
        run: |
          if [ -f starter.zip ]; then
            command -v unzip >/dev/null 2>&1 || (apt-get update && apt-get install -y unzip)
            unzip -o -q starter.zip
          fi

      - name: Verify project files
        run: |
          if [ ! -f project.godot ]; then
            echo "ERROR: project.godot not found. Upload starter.zip to the repository root."
            exit 1
          fi
          ls -la

      - name: Setup Godot and Android
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          IMG=/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -rf "$T"
          if [ -f "$IMG/android_debug.apk" ]; then
            echo "Using export templates that come with the image: $IMG"
            cp -r "$IMG" "$T"
          else
            echo "Templates not found in the image, downloading..."
            mkdir -p "$T"
            V="${GODOT_VERSION}-stable"
            F="Godot_v${V}_export_templates.tpz"
            OK=0
            for URL in \
              "https://github.com/godotengine/godot/releases/download/${V}/${F}" \
              "https://github.com/godotengine/godot-builds/releases/download/${V}/${F}" \
              "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/${F}"; do
              echo "Trying $URL"
              if wget -nv --tries=3 "$URL" -O /tmp/templates.tpz; then
                OK=1
                break
              fi
            done
            if [ "$OK" != "1" ]; then
              echo "ERROR: could not download the export templates from any mirror"
              exit 1
            fi
            unzip -q -o /tmp/templates.tpz 'templates/android*' 'templates/version.txt' -d /tmp/tpl
            cp /tmp/tpl/templates/* "$T"/
            rm -f /tmp/templates.tpz
          fi
          if [ ! -f "$T/android_debug.apk" ]; then
            echo "ERROR: android_debug.apk is missing in $T"
            ls -la "$T"
            exit 1
          fi
          echo "Android templates ready:"
          ls -la "$T" | head -20
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JDK="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which javac))))}"
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK}"
          export/android/java_sdk_path = "${JDK}"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          godot --version

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export debug APK
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --verbose --export-debug "Android" build/yearzero-debug.apk 2>&1 | tee build/export.log

      - name: Build summary
        if: success()
        run: |
          echo "### APK built successfully" >> $GITHUB_STEP_SUMMARY
          ls -lh build/*.apk >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yearzero-debug-apk-${{ github.run_number }}
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log-${{ github.run_number }}
          path: build/export.log
          if-no-files-found: ignore
          retention-days: 7
